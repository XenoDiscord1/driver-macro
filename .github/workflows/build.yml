name: Build MouseFilter Driver

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (WDK NuGet + MSVC)
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find WDK install path
      shell: pwsh
      run: |
        # WDK устанавливается в разные места — ищем где именно
        $possiblePaths = @(
          "C:\Program Files (x86)\Windows Kits\10\build",
          "C:\Program Files\Windows Kits\10\build",
          "D:\Program Files (x86)\Windows Kits\10\build",
          "D:\Program Files\Windows Kits\10\build"
        )
        foreach ($p in $possiblePaths) {
          if (Test-Path $p) {
            Write-Host "Found WDK build dir: $p"
            Get-ChildItem $p | Select-Object Name
          }
        }

        # Ищем по всему диску
        Write-Host "Searching for WindowsDriver.common.targets..."
        Get-ChildItem -Path "C:\", "D:\" -Recurse -Filter "WindowsDriver.common.targets" `
          -ErrorAction SilentlyContinue | Select-Object FullName

    - name: Install WDK via NuGet
      shell: pwsh
      run: |
        # Устанавливаем NuGet
        Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
        
        # Создаём временный проект для восстановления NuGet пакетов
        New-Item -ItemType Directory -Force -Path C:\wdk-nuget
        
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
          <ItemGroup>
            <PackageReference Include="Microsoft.Windows.WDK.x64" Version="10.0.22621.*" />
            <PackageReference Include="Microsoft.Windows.SDK.CPP" Version="10.0.22621.*" />
            <PackageReference Include="Microsoft.Windows.SDK.CPP.x64" Version="10.0.22621.*" />
          </ItemGroup>
        </Project>
        "@ | Out-File -FilePath C:\wdk-nuget\packages.props -Encoding UTF8

        nuget install Microsoft.Windows.WDK.x64 -Version 10.0.22621.3 -OutputDirectory C:\wdk-nuget\packages
        nuget install Microsoft.Windows.SDK.CPP -Version 10.0.22621.3 -OutputDirectory C:\wdk-nuget\packages
        nuget install Microsoft.Windows.SDK.CPP.x64 -Version 10.0.22621.3 -OutputDirectory C:\wdk-nuget\packages

        Write-Host "NuGet packages installed:"
        Get-ChildItem C:\wdk-nuget\packages | Select-Object Name

    - name: Patch vcxproj for NuGet WDK
      shell: pwsh
      run: |
        $wdkPkg = Get-ChildItem "C:\wdk-nuget\packages" -Filter "Microsoft.Windows.WDK.x64*" -Directory |
          Select-Object -First 1
        $sdkPkg = Get-ChildItem "C:\wdk-nuget\packages" -Filter "Microsoft.Windows.SDK.CPP.x64*" -Directory |
          Select-Object -First 1

        Write-Host "WDK package: $($wdkPkg.FullName)"
        Write-Host "SDK package: $($sdkPkg.FullName)"

        # Находим targets файл
        $wdkTargets = Get-ChildItem $wdkPkg.FullName -Recurse -Filter "WindowsDriver.common.targets" |
          Select-Object -First 1
        Write-Host "WDK targets: $($wdkTargets.FullName)"

        # Читаем vcxproj и патчим путь к WDK
        $vcxproj = Get-Content "driver\MouseFilter.vcxproj" -Raw
        
        # Добавляем PropertyGroup с путями перед закрывающим тегом Project
        $patch = @"
          <PropertyGroup>
            <WDKContentRoot>$($wdkPkg.FullName)\</WDKContentRoot>
            <WindowsSdkDir>$($sdkPkg.FullName)\</WindowsSdkDir>
          </PropertyGroup>
        "@
        
        $vcxproj = $vcxproj -replace '</Project>', "$patch`n</Project>"
        $vcxproj | Out-File "driver\MouseFilter.vcxproj" -Encoding UTF8
        Write-Host "vcxproj patched"

    - name: Build Driver
      shell: pwsh
      run: |
        $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -version "[17.0,18.0)" -requires Microsoft.Component.MSBuild `
          -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1

        Write-Host "MSBuild: $msbuild"
        New-Item -ItemType Directory -Force -Path artifacts\driver

        & $msbuild driver\MouseFilter.vcxproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:OutDir="${{ github.workspace }}\artifacts\driver\" `
          /p:IntDir="${{ github.workspace }}\obj\driver\" `
          /m /verbosity:normal

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host "Driver built OK"

    - name: Build App
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -version "[17.0,18.0)" -property installationPath
        $vcvars = "$vs\VC\Auxiliary\Build\vcvars64.bat"
        New-Item -ItemType Directory -Force -Path artifacts\app
        cmd /c "`"$vcvars`" && cl.exe /nologo /W3 /O2 /EHsc /MD /I driver app\MouseMonitor.cpp /Fe:artifacts\app\MouseMonitor.exe /link user32.lib"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Copy install files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts\install
        Copy-Item install\MouseFilter.inf  artifacts\install\
        Copy-Item install\Install.ps1      artifacts\install\
        Copy-Item driver\MouseFilter.h     artifacts\install\

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MouseFilter-${{ github.sha }}
        path: artifacts\
        retention-days: 30
