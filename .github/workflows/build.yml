name: Build MouseFilter Driver

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (WDK NuGet + MSVC)
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Install WDK via NuGet
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path C:\wdk-nuget

        nuget install Microsoft.Windows.WDK.x64 `
          -Version 10.0.22621.3 `
          -OutputDirectory C:\wdk-nuget `
          -NonInteractive

        nuget install Microsoft.Windows.SDK.CPP `
          -Version 10.0.22621.3 `
          -OutputDirectory C:\wdk-nuget `
          -NonInteractive

        nuget install Microsoft.Windows.SDK.CPP.x64 `
          -Version 10.0.22621.3 `
          -OutputDirectory C:\wdk-nuget `
          -NonInteractive

        Write-Host "Installed packages:"
        Get-ChildItem C:\wdk-nuget -Directory | Select-Object Name

    - name: Patch vcxproj
      shell: pwsh
      run: |
        $wdkPkg = Get-ChildItem "C:\wdk-nuget" -Filter "Microsoft.Windows.WDK.x64*" -Directory |
          Select-Object -First 1 -ExpandProperty FullName

        $sdkPkg = Get-ChildItem "C:\wdk-nuget" -Filter "Microsoft.Windows.SDK.CPP.x64*" -Directory |
          Select-Object -First 1 -ExpandProperty FullName

        Write-Host "WDK: $wdkPkg"
        Write-Host "SDK: $sdkPkg"

        # Ищем targets файл внутри пакета
        $targets = Get-ChildItem $wdkPkg -Recurse -Filter "WindowsDriver.common.targets" |
          Select-Object -First 1 -ExpandProperty DirectoryName
        Write-Host "Targets dir: $targets"

        # Патчим vcxproj — добавляем пути перед </Project>
        $vcxproj = Get-Content "driver\MouseFilter.vcxproj" -Raw

        $patch = "  <PropertyGroup>`n" +
                 "    <WDKContentRoot>$wdkPkg\</WDKContentRoot>`n" +
                 "    <WindowsSdkDir>$sdkPkg\</WindowsSdkDir>`n" +
                 "  </PropertyGroup>`n"

        $vcxproj = $vcxproj -replace '</Project>', "$patch</Project>"
        $vcxproj | Set-Content "driver\MouseFilter.vcxproj" -Encoding UTF8

        Write-Host "vcxproj patched OK"

    - name: Build Driver
      shell: pwsh
      run: |
        $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -version "[17.0,18.0)" -requires Microsoft.Component.MSBuild `
          -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1

        Write-Host "MSBuild: $msbuild"
        New-Item -ItemType Directory -Force -Path artifacts\driver

        & $msbuild driver\MouseFilter.vcxproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:OutDir="${{ github.workspace }}\artifacts\driver\" `
          /p:IntDir="${{ github.workspace }}\obj\driver\" `
          /m /verbosity:normal

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host "Driver built OK"

    - name: Build App
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -version "[17.0,18.0)" -property installationPath
        $vcvars = "$vs\VC\Auxiliary\Build\vcvars64.bat"
        New-Item -ItemType Directory -Force -Path artifacts\app
        cmd /c "`"$vcvars`" && cl.exe /nologo /W3 /O2 /EHsc /MD /I driver app\MouseMonitor.cpp /Fe:artifacts\app\MouseMonitor.exe /link user32.lib"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Copy install files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts\install
        Copy-Item install\MouseFilter.inf  artifacts\install\
        Copy-Item install\Install.ps1      artifacts\install\
        Copy-Item driver\MouseFilter.h     artifacts\install\

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MouseFilter-${{ github.sha }}
        path: artifacts\
        retention-days: 30
